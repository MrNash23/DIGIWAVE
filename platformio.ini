[platformio]
default_envs = pager
boards_dir = boards
; Settings of one machine, such as another place for the toolchains, go into
; platformio_local.ini, which is not under version control.
extra_configs = platformio_local.ini

[env:pager]
; LilyGoLib needs Arduino-ESP32 3.3 or later, which the official espressif32 platform does not ship
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.35/platform-espressif32.zip
framework = arduino
board = lilygo-t-lora-pager
upload_speed = 921600
monitor_speed = 115200
monitor_filters = default, esp32_exception_decoder
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags =
    -D CORE_DEBUG_LEVEL=0
    -D ARDUINO_T_LORA_PAGER
    -D ARDUINO_LILYGO_LORA_SX1262
    ; NFC is not used; see src/hal/nfc_absent.h
    -include src/hal/nfc_absent.h
    -I variants/lilygo_tlora_pager
    -Wnarrowing
; RadioLib, lvgl, XPowersLib and SensorLib are pulled in by LilyGoLib at the versions it was tested with
lib_deps =
    xinyuan-lilygo/LilyGoLib @ 0.2.1
    mikalhart/TinyGPSPlus @ ^1.0.3
    adafruit/Adafruit TCA8418 @ ^1.0.2
    adafruit/Adafruit BusIO @ ^1.17.0

; Host build of the hardware-independent core, used by `pio test -e native`
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -O2
build_src_filter = -<*>
lib_compat_mode = off
